[build-system]
requires = ["maturin == 1.14.1"]
build-backend = "maturin"

[tool.maturin]
python-source = "py-src"
module-name = "base64_rs._base64_rs"

[project]
name = "base64-rs"
dynamic = ["version"]
requires-python = ">= 3.11"
description = "High-performance base64 encoder/decoder written in Rust"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Unlicense"
license-files = ["UNLICENSE"]
authors = [
    { name = "chirizxc", email = "chirizxc@proton.me" }
]
keywords = ["base64"]
classifiers = [
    "Typing :: Typed",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Development Status :: 5 - Production/Stable",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lava-sh/base64-rs"
Repository = "https://github.com/lava-sh/base64-rs"
Issues = "https://github.com/lava-sh/base64-rs/issues"
Changelog = "https://github.com/lava-sh/base64-rs/blob/main/CHANGELOG.md"

[dependency-groups]
typos = ["typos == 1.49.0"]
zizmor = ["zizmor == 1.29.0"]
rumdl = ["rumdl == 0.2.58"]
maturin = [
    "maturin == 1.14.1 ; sys_platform != 'linux'",
    "maturin[patchelf] == 1.14.1 ; sys_platform == 'linux'",
]
pytest = ["pytest == 9.1.1"]
wasm-test = [
    { include-group = "pytest" },
    "pytest-pyodide == 0.59.2",
    "pytest-httpserver == 1.1.5",
]
ci = [
    "mypy == 2.3.1",
    "ty == 0.0.73",
    "ruff == 0.16.4",
    { include-group = "pytest" },
    { include-group = "maturin" },
]
dev = [
    "rust-just == 1.58.0",
    { include-group = "ci" },
    { include-group = "typos" },
    { include-group = "rumdl" },
    { include-group = "zizmor" },
]
bench = []

[tool.uv.dependency-groups]
wasm-test = { requires-python = ">= 3.13" }

