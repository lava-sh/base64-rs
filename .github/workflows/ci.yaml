name: CI

permissions: { }

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  cargo-fmt:
    name: "cargo fmt"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly # zizmor: ignore[unpinned-uses]
        with:
          components: rustfmt

      - run: cargo fmt-nightly --check

  cargo-clippy:
    name: "cargo clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name == 'pull_request'
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]

      - uses: dtolnay/rust-toolchain@nightly # zizmor: ignore[unpinned-uses]
        with:
          components: clippy

      - run: cargo clippy --all-features --all-targets

  tools:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: "zizmor"
            command: zizmor .github/

          - name: "typos"
            command: typos

          - name: "rumdl"
            command: rumdl check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: "Install uv"
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          # zizmor: ignore[cache-poisoning]
          enable-cache: ${{ github.event_name == 'pull_request' }}

      - name: "Install ${{ matrix.name }}"
        run: uv pip install --group ${{ matrix.name }} --system

      - name: "Run ${{ matrix.name }}"
        run: ${{ matrix.command }}

  tests-alpine:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-tests') }}

    name: "tests / alpine / python 3.14"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run build on alpine"
        run: |
          docker build -t alpine-test .github/scripts/alpine
          docker run --rm -v "$PWD":/app -w /app alpine-test

  tests:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-tests') }}

    uses: ./.github/workflows/tests.yaml

  manylinux:
    if: ${{ always() && !failure() && !cancelled() }}

    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: ./.github/workflows/manylinux.yaml

  musllinux:
    if: ${{ always() && !failure() && !cancelled() }}

    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: ./.github/workflows/musllinux.yaml

  windows:
    if: ${{ always() && !failure() && !cancelled() }}

    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: ./.github/workflows/windows.yaml

  macos:
    if: ${{ always() && !failure() && !cancelled() }}

    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: ./.github/workflows/macos.yaml

  wasm:
    if: ${{ always() && !failure() && !cancelled() }}

    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: ./.github/workflows/wasm.yaml

  android:
    if: ${{ always() && !failure() && !cancelled() }}

    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: ./.github/workflows/android.yaml

  build-sdist:
    name: "build sdist"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Build sdist"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: "Upload sdist"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  release-pypi:
    if: ${{ always() && !failure() && !cancelled() }}

    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [
      build-sdist,
      manylinux,
      musllinux,
      windows,
      macos,
      wasm,
      android,
    ]
    environment: pypi
    permissions:
      # Used to sign the release's artifacts and upload to PyPI using trusted publisher
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: "Install uv"
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: "Validate PyPI publication"
        run: uv publish 'wheels-*/*' --dry-run

      - name: "Generate PyPI publish attestations"
        if: github.ref_type == 'tag'
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: |
            wheels-*/*.whl
            wheels-*/*.tar.gz

      - name: "Publish to PyPI"
        if: github.ref_type == 'tag'
        run: uv publish --trusted-publishing=always 'wheels-*/*'
